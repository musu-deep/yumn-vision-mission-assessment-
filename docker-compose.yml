services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: yumn
      POSTGRES_USER: yumn
      POSTGRES_PASSWORD: yumn_password
    volumes:
      - yumn_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yumn -d yumn"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  yumn_db:
